<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Tilt+Neon:wght@400&family=Tilt+Warp:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="games.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Game Library | Raniel Angelo</title>
</head>
<body>

    <section id="games" class="bg-primary-subtle min-vh-100 py-4">

        <div class="container">

            <!-- Update this href when linking to the portfolio -->
            <a href="index.html" class="btn btn-outline-dark rounded-pill px-4 neon-font">
                <i class="fa-solid fa-chevron-left me-2"></i>Back
            </a>

            <div class="text-center mt-4 mb-5">
                <h1 class="display-4 fw-bold grotesque-font mb-2" id="pageTitle">
                    <span class="text-light">Game</span> Library
                </h1>
                <p class="lead neon-font mb-0" id="pageSubtitle"></p>
            </div>

        </div>

        <div class="game-stage" id="gameStage" role="region" aria-roledescription="carousel" aria-label="Game list">

            <button type="button" class="game-nav game-nav--prev" id="prevBtn" aria-label="Previous game">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="game-track" id="gameTrack">
                <p class="game-message neon-font">Loading games…</p>
            </div>

            <button type="button" class="game-nav game-nav--next" id="nextBtn" aria-label="Next game">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>

        <p class="text-center neon-font fs-5 mt-4 mb-0" id="gameCounter" aria-live="polite"></p>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="games.js"></script>
</body>
</html>
