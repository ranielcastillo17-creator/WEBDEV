<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Tilt+Neon:wght@400&family=Tilt+Warp:wght@400&display=swap" rel="stylesheet">

    <!-- Shared portfolio styles, then page styles.
         If games.html sits in the same folder as style.css, change to href="style.css" -->
    <link rel="stylesheet" href="../style.css?v=2">
    <link rel="stylesheet" href="games.css">

    <title>Games | Raniel</title>
</head>
<body>

    <section class="bg-primary-subtle games-hero">

        <nav class="navbar navbar-expand-lg py-4">
            <div class="container">
                <a class="navbar-brand fw-bold fs-1 logo-font" href="https://ranielcastillo17-creator.github.io">
                    raniel<span class="text-light">.</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto gap-lg-5">
                        <li class="nav-item"><a class="nav-link fw-semibold neon-font" href="https://ranielcastillo17-creator.github.io">Home</a></li>
                        <li class="nav-item"><a class="nav-link fw-semibold neon-font" href="https://ranielcastillo17-creator.github.io/#about">About</a></li>
                        <li class="nav-item"><a class="nav-link fw-semibold neon-font" href="https://ranielcastillo17-creator.github.io/WEBDEV/skills/skills.html">Skills</a></li>
                        <li class="nav-item"><a class="nav-link fw-semibold neon-font" href="https://ranielcastillo17-creator.github.io/WEBDEV/projects/projects.html">Projects</a></li>
                        <li class="nav-item"><a class="nav-link fw-semibold neon-font" href="https://ranielcastillo17-creator.github.io/#contact">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container text-center">
            <h1 class="display-3 fw-bold grotesque-font mb-3">
                <span class="text-light">My</span> Game List
            </h1>
            <p class="lead neon-font mx-auto hero-copy mb-0">
                A collection of games I love playing. Hover (or tap) a card for quick links.
            </p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">

            <div class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-md-center mb-5">
                <div class="filter-bar d-flex flex-wrap gap-2" id="filters" role="group" aria-label="Filter by genre"></div>
                <input type="search" id="search" class="form-control search-input" placeholder="Search games..." aria-label="Search games">
            </div>

            <div class="game-grid" id="gameGrid"></div>

            <p class="empty-state text-center neon-font fs-5 mt-4" id="emptyState">No games found.</p>

        </div>
    </section>

    <footer class="bg-primary-subtle py-3">
        <div class="container text-center">
            © 2026 Raniel Angelo Castillo. All Rights Reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="games.js"></script>
</body>
</html>
