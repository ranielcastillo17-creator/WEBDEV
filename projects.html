<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Tilt+Neon:wght@400&family=Tilt+Warp:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=6">

    <title>Projects | Raniel</title>
</head>
<body>

    <section class="bg-primary-subtle pb-4 pb-lg-5 projects-hero">

        <nav class="navbar navbar-expand-lg py-3 py-lg-4">
            <div class="container">

                <a class="navbar-brand fw-bold fs-1 logo-font" href="index.html">
                    raniel<span class="text-light">.</span>
                </a>

                <button class="navbar-toggler" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto gap-lg-5">
                        <li class="nav-item">
                            <a class="nav-link fw-semibold neon-font" href="index.html#home">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link fw-semibold neon-font" href="index.html#about">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link fw-semibold neon-font" href="index.html#skills">Skills</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link fw-semibold neon-font active" aria-current="page" href="projects.html">Projects</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link fw-semibold neon-font" href="index.html#contact">Contact</a>
                        </li>
                    </ul>

                </div>

            </div>
        </nav>

        <div class="container pt-3 pt-lg-4 pb-2 pb-lg-3">
            <h1 class="display-4 fw-bold grotesque-font mb-2">Projects</h1>
        </div>

    </section>

    <section class="py-4 py-lg-5">

        <div class="container">

            <div class="project-grid" id="projectGrid"></div>

        </div>

    </section>

    <div class="modal fade" id="projectModal" tabindex="-1" aria-label="Project image" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <button type="button" class="btn-close btn-close-white ms-auto mb-2" data-bs-dismiss="modal" aria-label="Close"></button>
                <img id="projectModalImg" class="img-fluid rounded-4" alt="">
            </div>
        </div>
    </div>

    <footer class="bg-primary-subtle py-3">

        <div class="container text-center">

            © 2026 Raniel Angelo Castillo.
            All Rights Reserved.

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const projectGrid = document.getElementById('projectGrid');
        const projectSizes = [
            'large', '', '', 'feature', 'wide', 'large', '', '', 'large', '', '',
            'wide', 'feature', 'tall'
        ];

        projectGrid.innerHTML = projectSizes.map((size, index) => {
            const number = index + 1;
            const image = `images/projects/${number}.jpg`;
            const sizeClass = size ? ` bento-card--${size}` : '';

            return `
                <div class="card bento-card${sizeClass}">
                    <button class="bento-btn" type="button" data-bs-toggle="modal"
                        data-bs-target="#projectModal" data-img="${image}">
                        <img src="${image}" alt="Project ${number}" loading="lazy">
                    </button>
                </div>`;
        }).join('');

        document.getElementById('projectModal').addEventListener('show.bs.modal', event => {
            const image = document.getElementById('projectModalImg');
            const trigger = event.relatedTarget;
            image.src = trigger.dataset.img;
            image.alt = trigger.querySelector('img').alt;
        });
    </script>

</body>
</html>
